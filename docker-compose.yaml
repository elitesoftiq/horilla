services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    restart: unless-stopped
    environment:
      # Update these values to match your PostgreSQL server configuration
      DATABASE_URL: "postgres://[username]:[password]@host.docker.internal:5432/horilla"
      # Django security settings
      ALLOWED_HOSTS: "hr.elitesoft.iq,localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "https://hr.elitesoft.iq,http://localhost:8000"
      DEBUG: "False"
    command: sh ./entrypoint.sh
    volumes:
      # Persistent volumes for data that should survive container reinstallation
      - horilla-media:/app/media
      - horilla-static:/app/static
    extra_hosts:
      # Allows container to access host's localhost (for PostgreSQL on host)
      - "host.docker.internal:host-gateway"
    # Healthcheck for the application
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  horilla-media:
    name: horilla-media
  horilla-static:
    name: horilla-static

