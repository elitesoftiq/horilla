{% load i18n %}
<div class="oh-modal__dialog-header pb-0">
    <span class="oh-modal__dialog-title" id="createModal1ModalLabel">
        {% if shift.id %} {% trans "Update" %} {% else %} {% trans "Create" %} {% endif %} {{form.verbose_name}}
    </span>
    <button class="oh-modal__close" aria-label="Close">
        <ion-icon name="close-outline"></ion-icon>
    </button>
</div>
<div class="oh-modal__dialog-body">
    <form hx-post="{{ request.get_full_path }}"
        hx-target="{% if dynamic %} #dynamicCreateModalBody {% else %} #shiftForm {% endif %}"
        class="oh-profile-section">
        {% csrf_token %} {{form.non_field_errors}}
        {{form.as_p}}
    </form>
</div>
<script>
(function () {
    function toggleOfficeDays() {
        var hybridCheckbox = document.querySelector('[name="is_hybrid"]');
        var wrapper = document.getElementById('id_office_days_per_week_parent_div');
        if (!hybridCheckbox || !wrapper) return;
        wrapper.style.display = hybridCheckbox.checked ? '' : 'none';
    }
    function initToggle() {
        var hybridCheckbox = document.querySelector('[name="is_hybrid"]');
        if (hybridCheckbox) {
            toggleOfficeDays();
            hybridCheckbox.addEventListener('change', toggleOfficeDays);
        }
    }
    document.addEventListener('DOMContentLoaded', initToggle);
    document.body.addEventListener('htmx:afterSwap', initToggle);
})();
</script>
