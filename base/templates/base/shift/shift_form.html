{% load i18n %}
<div class="oh-modal__dialog-header pb-0">
    <span class="oh-modal__dialog-title" id="createModal1ModalLabel">
        {% if shift.id %} {% trans "Update" %} {% else %} {% trans "Create" %} {% endif %} {{form.verbose_name}}
    </span>
    <button class="oh-modal__close" aria-label="Close">
        <ion-icon name="close-outline"></ion-icon>
    </button>
</div>
<div class="oh-modal__dialog-body">
    <form hx-post="{{ request.get_full_path }}"
        hx-target="{% if dynamic %} #dynamicCreateModalBody {% else %} #shiftForm {% endif %}"
        class="oh-profile-section">
        {% csrf_token %} {{form.non_field_errors}}
        {{form.as_p}}
        <div class="oh-modal__dialog-footer p-0 mt-3">
            <button type="submit" class="oh-btn oh-btn--secondary oh-btn--shadow">
                {% trans "Save" %}
            </button>
        </div>
    </form>
</div>
<script>
(function () {
    function toggleOfficeDays() {
        var hybridCheckbox = document.querySelector('[name="is_hybrid"]');
        var officeDaysRow = document.querySelector('[name="office_days_per_week"]');
        if (!hybridCheckbox || !officeDaysRow) return;
        var wrapper = officeDaysRow.closest('p') || officeDaysRow.closest('.oh-input-group') || officeDaysRow.parentElement;
        if (wrapper) wrapper.style.display = hybridCheckbox.checked ? '' : 'none';
    }
    document.addEventListener('DOMContentLoaded', function () {
        var hybridCheckbox = document.querySelector('[name="is_hybrid"]');
        if (hybridCheckbox) {
            toggleOfficeDays();
            hybridCheckbox.addEventListener('change', toggleOfficeDays);
        }
    });
    // Handle htmx loads (form injected after page load)
    document.body.addEventListener('htmx:afterSwap', function () {
        var hybridCheckbox = document.querySelector('[name="is_hybrid"]');
        if (hybridCheckbox) {
            toggleOfficeDays();
            hybridCheckbox.addEventListener('change', toggleOfficeDays);
        }
    });
})();
</script>
