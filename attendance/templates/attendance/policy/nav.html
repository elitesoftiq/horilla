{% load i18n %} {% load basefilters %}
<section class="oh-wrapper oh-main__topbar" x-data="{searchShow: false}">
  <div class="oh-main__titlebar oh-main__titlebar--left">
    <h1 class="oh-main__titlebar-title fw-bold">
      <a href="{% url 'attendance-policy-view' %}" class="text-dark">
        {% trans "Attendance Policies" %}
      </a>
    </h1>
    <a class="oh-main__titlebar-search-toggle" role="button" @click="searchShow = !searchShow">
      <ion-icon name="search-outline" class="oh-main__titlebar-serach-icon"></ion-icon>
    </a>
  </div>
  <form hx-get="{% url 'attendance-policy-search' %}" id="filterForm" hx-swap="innerHTML" hx-target="#policyContainer">
    <div class="oh-main__titlebar oh-main__titlebar--right">
      <div class="oh-input-group oh-input__search-group" :class="searchShow ? 'oh-input__search-group--show' : ''">
        <ion-icon name="search-outline" class="oh-input-group__icon oh-input-group__icon--left"></ion-icon>
        <input type="text" class="oh-input oh-input__icon" name="search"
          placeholder="{% trans 'Search' %}" onkeyup="$('.filterButton')[0].click()" />
      </div>
      <div class="oh-main__titlebar-button-container">
        <div class="oh-dropdown" x-data="{open: false}">
          <button class="oh-btn ml-2" @click="open = !open" onclick="event.preventDefault()">
            <ion-icon name="filter" class="mr-1"></ion-icon>{% trans "Filter" %}
            <div id="filterCount"></div>
          </button>
          <div class="oh-dropdown__menu oh-dropdown__menu--right oh-dropdown__filter p-4" x-show="open"
            @click.outside="open = false" style="display: none;">
            {% include 'attendance/policy/filters.html' %}
          </div>
        </div>
        {% if perms.attendance.add_attendancepolicy %}
          <button type="button" class="oh-btn oh-btn--secondary ml-2"
            data-toggle="oh-modal-toggle" data-target="#policyFormModal"
            hx-get="{% url 'attendance-policy-create' %}" hx-target="#policyFormModalTarget">
            <ion-icon name="add-outline" class="mr-1"></ion-icon>{% trans "Create" %}
          </button>
        {% endif %}
      </div>
    </div>
  </form>
</section>
