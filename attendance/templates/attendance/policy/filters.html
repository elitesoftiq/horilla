{% load i18n %}
<div class="oh-accordion">
  {% for field in f.form %}
    <div class="oh-input-group mb-2">
      <label class="oh-label">{{ field.label }}</label>
      {{ field }}
    </div>
  {% endfor %}
  <button type="submit" class="filterButton oh-btn oh-btn--secondary w-100 mt-2">
    {% trans "Apply" %}
  </button>
</div>
